# Use tmux's full terminal description in panes. The iTerm2 utilities also use
# this value to select their tmux-safe, chunked transfer protocol.
set-option -g default-terminal "tmux-256color"

# SSH updates the session environment before this hook runs. Refresh the
# stable agent socket immediately, including when SSH starts tmux -CC directly.
set-hook -g client-attached 'run-shell "$HOME/repos/my-env/configs/.tmux-refresh-ssh-auth-sock #{q:SSH_AUTH_SOCK}"'
